# Free Hobby deploy for Paper Desk (testing).
# Free web services sleep after ~15 min idle.
# Keep-alive + pre-market wake: GitHub Actions (.github/workflows/render-paper-cron.yml)
# — Render Cron Jobs are paid; do not add type:cron here on free tier.
# Docs: https://render.com/docs/free

services:
  - type: web
    name: algo-paper-desk
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -e .
    startCommand: PYTHONPATH=src python -m algo.cli paper ui --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PAPER_PRICE_SOURCE
        value: auto
      - key: DHAN_MODE
        value: live
      - key: DATABASE_URL
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PAPER_SYNC_TOKEN
        sync: false
