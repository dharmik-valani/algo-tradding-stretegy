# Free Hobby deploy for Paper Desk (testing).
# Free web services sleep after ~15 min idle — use an external cron to hit
# /api/health and POST /api/session/start before market open.
# Docs: https://render.com/docs/free

services:
  - type: web
    name: algo-paper-desk
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -e .
    startCommand: PYTHONPATH=src python -m algo.cli paper ui --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PAPER_PRICE_SOURCE
        value: auto
      - key: DHAN_MODE
        value: live
      - key: DATABASE_URL
        value: sqlite:///./data/algo.db
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
