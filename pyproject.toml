[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo"
version = "0.1.0"
description = "Historical-data foundation for an Indian-market algo trading platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "pandas>=2.2",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "certifi>=2024.0",
  "dhanhq>=2.2.0",
  "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
algo = "algo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
algo = ["paper/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
